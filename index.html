<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== Header / Nav ===== -->
    <header class="app-header">
      <h2 class="app-title">Life Dashboard</h2>
      <button id="theme-toggle-btn" aria-label="Toggle theme">🌙 Dark Mode</button>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="dashboard-grid">

      <!-- 1. Greeting Widget -->
      <section class="card" id="greeting-section" aria-label="Greeting">
        <h1 id="greeting-text">Good Morning!</h1>
        <p id="date-text"></p>
        <p id="time-text"></p>

        <div class="name-form">
          <label for="name-input">Your name:</label>
          <input
            type="text"
            id="name-input"
            maxlength="50"
            placeholder="Enter your name"
            aria-describedby="name-error"
          />
          <button id="name-save-btn">Save</button>
          <span id="name-error" class="error-msg" role="alert" aria-live="polite"></span>
        </div>
      </section>

      <!-- 2. Pomodoro Timer -->
      <section class="card" id="timer-section" aria-label="Pomodoro timer">
        <h2>Focus Timer</h2>

        <div id="timer-display" aria-live="polite" aria-label="Timer countdown">25:00</div>

        <div class="timer-controls">
          <button id="timer-start-btn">Start</button>
          <button id="timer-stop-btn">Stop</button>
          <button id="timer-reset-btn">Reset</button>
        </div>

        <div class="timer-duration-form">
          <label for="timer-duration-input">Duration (min):</label>
          <input
            type="number"
            id="timer-duration-input"
            min="1"
            max="120"
            placeholder="25"
            aria-describedby="timer-duration-error"
          />
          <button id="timer-duration-submit">Set</button>
          <span id="timer-duration-error" class="error-msg" role="alert" aria-live="polite"></span>
        </div>

        <p id="timer-done-msg" class="timer-done-msg" role="alert" aria-live="assertive">
          ⏰ Session complete!
        </p>
      </section>

      <!-- 3. To-Do Task List -->
      <section class="card" id="tasks-section" aria-label="To-do list">
        <h2>To-Do List</h2>

        <div class="task-input-row">
          <label for="task-input" class="sr-only">New task</label>
          <input
            type="text"
            id="task-input"
            maxlength="100"
            placeholder="Add a new task…"
            aria-describedby="task-input-error"
          />
          <button id="task-add-btn">Add</button>
        </div>
        <span id="task-input-error" class="error-msg" role="alert" aria-live="polite"></span>

        <ul id="task-list" aria-label="Tasks"></ul>
      </section>

      <!-- 4. Quick Links -->
      <section class="card" id="links-section" aria-label="Quick links">
        <h2>Quick Links</h2>

        <div class="link-input-group">
          <label for="link-name-input" class="sr-only">Link name</label>
          <input
            type="text"
            id="link-name-input"
            maxlength="50"
            placeholder="Name (e.g. GitHub)"
            aria-describedby="link-error"
          />

          <label for="link-url-input" class="sr-only">Link URL</label>
          <input
            type="url"
            id="link-url-input"
            placeholder="https://example.com"
            aria-describedby="link-error"
          />

          <button id="link-add-btn">Add Link</button>
        </div>
        <span id="link-error" class="error-msg" role="alert" aria-live="polite"></span>

        <div id="links-grid" aria-label="Saved links"></div>
      </section>

    </main>

    <!-- ===== Storage Error Toast ===== -->
    <div
      id="storage-error-toast"
      class="toast"
      role="alert"
      aria-live="assertive"
    >
      Could not save your changes. Storage may be full.
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
